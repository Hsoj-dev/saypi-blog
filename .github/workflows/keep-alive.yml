name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 4 days
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Development
            url_secret: DEV_SUPABASE_URL
            key_secret: DEV_SUPABASE_KEY
          - name: Production
            url_secret: PROD_SUPABASE_URL
            key_secret: PROD_SUPABASE_KEY
    steps:
      - name: Ping ${{ matrix.name }}
        run: |
          curl -if -X GET "${{ secrets[matrix.url_secret] }}/rest/v1/keepalive?select=id&limit=1" \
          -H "apikey: ${{ secrets[matrix.key_secret] }}" \
          -H "Authorization: Bearer ${{ secrets[matrix.key_secret] }}"