name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 4 days
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production
        run: |
          curl -if -X GET "${{ secrets.PROD_SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
          -H "apikey: ${{ secrets.PROD_SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.PROD_SUPABASE_KEY }}"
